hostname	"TRT Monkey Summer Prophunt"
sv_downloadurl                  "http://gmod.greatsea.online:27000"
sv_loadingurl			"https://alexandereconomy.com"
sv_allowdownload                1
sv_allowupload                  1
sv_kickerrornum			0

// ── Gameplay ──────────────────────────────────────────────────────────────────
ph_hunter_fire_penalty		10	// default 5; higher discourages spam shooting
ph_hunter_kill_bonus		100
ph_swap_teams_every_round	1
ph_game_time			40
ph_hunter_blindlock_time	45	// was ph_blindlock_time (renamed in PHX2)
ph_round_time			315
ph_rounds_per_map		6

// ── Team balance ──────────────────────────────────────────────────────────────
ph_enable_teambalance		1
ph_forcejoinbalancedteams	1
ph_preventconsecutivehunting	1	// don't assign same player hunter twice in a row
ph_waitforplayers		1	// don't start a round with only 1 player
ph_allow_respawn_from_spectator	1	// lets late-joiners get into the game

// ── Prop settings ─────────────────────────────────────────────────────────────
ph_prop_camera_collisions	1
ph_prop_collision		0
ph_prop_additional_models	1
ph_better_prop_movement		1
ph_falldamage			0	// props shouldn't die from falls
ph_props_disable_footstep	1	// footsteps give away hiding props
ph_usable_prop_type		1	// restrict E-use pickup to hunters only
ph_notice_prop_rotation		0	// suppress per-rotation chat spam

// ── Player models ─────────────────────────────────────────────────────────────
ph_use_custom_plmodel		1
ph_use_custom_plmodel_for_prop	0

// ── Hunter experience ─────────────────────────────────────────────────────────
ph_enable_thirdperson		1
ph_freezecam			1
ph_freezecam_hunter		1
ph_give_grenade_near_roundend	1	// give hunters grenades in final seconds
ph_give_grenade_roundend_before_time 15

// ── Unstuck ───────────────────────────────────────────────────────────────────
ph_enable_unstuck		1
ph_unstuck_waittime		5

// ── Taunts ────────────────────────────────────────────────────────────────────
ph_custom_taunt_mode		2	// was ph_enable_custom_taunts 1 (renamed in PHX2)
ph_customtaunts_delay		7
ph_autotaunt_enabled		1
ph_autotaunt_delay		60	// auto-taunt every 60s to help hunters locate props
ph_normal_taunt_delay		2

// ── Devil & Lucky balls ───────────────────────────────────────────────────────
ph_enable_devil_balls		1	// devil balls spawn when a hunter dies
ph_enable_lucky_balls		1	// lucky balls on breakable props

// ── Last Prop Standing ────────────────────────────────────────────────────────
lps_enable			1
lps_enable_music		1
lps_start_every_x_rounds	3	// triggers on rounds 3 and 6 with 6 rounds/map
lps_mins_prop_players		2
lps_halo_enable			1

// ── Prop Menu (prop chooser) ──────────────────────────────────────────────────
pcr_enable			1
pcr_max_use			2	// 2 prop changes per round
pcr_enable_bbox_limit		1	// block oversized/broken props
pcr_bbox_max_height		96
pcr_bbox_max_width		72

// ── Map voting ────────────────────────────────────────────────────────────────
ph_enable_mapvote		1
mv_mapprefix			"phx_,ph_"
mv_rtvcount			3
mv_cooldown			1
mv_timelimit			30
mv_allowcurmap			0
